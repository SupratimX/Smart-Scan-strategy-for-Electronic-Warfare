# Spatial Scan Emitters Scenario
# --------------------------------
# Models three spatially-scanning (rotating-antenna) radar emitters.
# Each emitter sweeps a beam across the horizon; the ES receiver
# intercepts the signal only during the brief window when the beam
# points towards it (beam_dwell_fraction of the scan period).
#
# This scenario directly exercises the DRDO problem statement requirement:
#   "interception of spatially scanning ... emitters"

scenario_id: spatial_scan_emitters
description: >
  Three spatially-scanning radar emitters with different scan rates
  and beam dwell fractions. Schedulers must predict the beam sweep
  timing to achieve high interception rates.
seed: 42
n_slots: 2000

emitters:
  # Slow-rotating surveillance radar — 80-slot full rotation, 4% dwell
  # Beam on for round(0.04 * 80) = 3 slots per cycle
  - kind: spatial_scan
    emitter_id: 0
    band_id: 4
    power_dbm: -55.0
    scan_period_slots: 80
    beam_dwell_fraction: 0.04
    phase_offset_slots: 0

  # Medium-speed tracking radar — 40-slot rotation, 5% dwell
  # Beam on for round(0.05 * 40) = 2 slots per cycle
  - kind: spatial_scan
    emitter_id: 1
    band_id: 12
    power_dbm: -58.0
    scan_period_slots: 40
    beam_dwell_fraction: 0.05
    phase_offset_slots: 15

  # Fast fire-control radar — 20-slot rotation, 10% dwell
  # Beam on for round(0.10 * 20) = 2 slots per cycle
  - kind: spatial_scan
    emitter_id: 2
    band_id: 20
    power_dbm: -62.0
    scan_period_slots: 20
    beam_dwell_fraction: 0.10
    phase_offset_slots: 7

noise_std_db: 2.0
interference_bands: []
