suite_id: full_benchmark
description: "Full benchmark suite: all scenarios x all schedulers x 5 seeds"
scenario_configs:
  - configs/scenarios/empty_spectrum.yaml
  - configs/scenarios/fixed_emitters.yaml
  - configs/scenarios/periodic_emitters.yaml
  - configs/scenarios/frequency_agile.yaml
  - configs/scenarios/dense_environment.yaml
scheduler_names:
  - uniform_sweep
  - random_scan
  - round_robin
  - greedy_occupancy
  - thompson_sampling
  - periodicity_aware
n_seeds: 5
base_seed: 42
reward_weights:
  w_detection: 1.0
  w_false_alarm: 0.5
  w_intercept_time: 0.2
  w_coverage: 0.1
  w_switch: 0.05
